# ============================================================
#  Nginx (hôte) → Yobante Colis API
#  Installation : copier dans /etc/nginx/sites-available/yobante-colis,
#  lier dans sites-enabled, adapter server_name, puis : nginx -t && systemctl reload nginx
#  Le backend (conteneur ou PM2) écoute sur 127.0.0.1:API_PORT_HOTE (3000 par défaut) :
#  adapter la ligne « server 127.0.0.1:… » de l'upstream si le port a été changé.
# ============================================================

# Limitation de débit en amont de l'application (défense en profondeur)
limit_req_zone $binary_remote_addr zone=colis_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=colis_api:10m rate=20r/s;

upstream colis_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP → HTTPS (le défi ACME de certbot reste servi en HTTP)
server {
    listen 80;
    listen [::]:80;
    server_name api.yobanterek.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yobanterek.com;

    ssl_certificate         /etc/letsencrypt/live/api.yobanterek.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/api.yobanterek.com/privkey.pem;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;
    ssl_stapling            on;
    ssl_stapling_verify     on;

    server_tokens off;
    # Photos de colis (10 × 10 Mo max côté API) : au-delà, refus dès Nginx
    client_max_body_size 25M;

    # En-têtes de sécurité : posés par Nginx, ceux de l'API sont retirés pour
    # ne jamais les envoyer en double (l'API les pose aussi via Helmet).
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Paramètres communs de proxy (keep-alive vers l'amont, identifiant de corrélation)
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-ID      $request_id;
    proxy_read_timeout 60s;

    # Authentification : débit strict par IP
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password|verify-email|resend-verification) {
        limit_req zone=colis_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://colis_backend;
    }

    # API — chemin canonique /api/v1/… transmis tel quel
    location /api/v1/ {
        limit_req zone=colis_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://colis_backend;
    }

    # API — chemin historique /api/… (préfixe retiré, comme avant)
    location /api/ {
        limit_req zone=colis_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://colis_backend/;
    }

    # Sonde de disponibilité (supervision externe)
    location = /health {
        proxy_pass http://colis_backend/health;
        access_log off;
    }

    location / {
        return 404;
    }
}
