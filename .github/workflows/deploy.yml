name: Deploy Yobante Colis API

# Déploiement uniquement après une CI réussie sur main (lint, migrations, tests, build)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }}
            git pull --rebase origin main
            docker compose -f docker-compose.prod.yml up -d --build backend
            docker image prune -f
            # Les migrations s'exécutent au démarrage : on attend que l'API joigne la base
            for i in $(seq 1 24); do
              if curl -sf http://localhost:3000/ready > /dev/null; then
                echo "✔ Déploiement réussi"; exit 0
              fi
              sleep 5
            done
            echo "✗ L'API n'est pas prête après 2 minutes"
            docker compose -f docker-compose.prod.yml logs --tail=100 backend
            exit 1
