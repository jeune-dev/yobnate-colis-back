name: Deploy Yobante Colis API

# Déploiement uniquement après une CI réussie sur main (lint, migrations, tests, image)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Jamais deux déploiements en parallèle sur le même serveur
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement sur le VPS
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }}
            git pull --rebase origin main

            COMPOSE="docker compose --env-file .env.prod -f docker-compose.prod.yml"

            # Les migrations ne sont pas lancées ici : l'entrypoint du conteneur
            # attend la base et les applique avant de démarrer l'application.
            $COMPOSE up -d --build --remove-orphans

            # Attente de l'état « healthy » réel (HEALTHCHECK sur /ready : base comprise).
            # Délai large : les migrations (index CONCURRENTLY) s'exécutent au démarrage.
            echo "Attente du démarrage (migrations incluses)…"
            etat="absent"
            for i in $(seq 1 60); do
              id=$($COMPOSE ps -q backend)
              etat=$([ -n "$id" ] && docker inspect -f '{{.State.Health.Status}}' "$id" 2>/dev/null || echo absent)
              [ "$etat" = "healthy" ] && break
              if [ "$etat" = "absent" ] || [ "$etat" = "unhealthy" ]; then
                echo "Conteneur $etat — migrations ou démarrage en échec :"
                $COMPOSE logs --tail=100 backend
                exit 1
              fi
              sleep 5
            done
            if [ "$etat" != "healthy" ]; then
              echo "Conteneur non healthy après 300 s :"
              $COMPOSE logs --tail=100 backend
              exit 1
            fi

            PORT_HOTE="$(grep -E '^API_PORT_HOTE=' .env.prod | cut -d= -f2 | tr -d '[:space:]')"
            curl -fsS "http://127.0.0.1:${PORT_HOTE:-3000}/ready"
            docker image prune -f
            echo "✔ Déploiement terminé — backend healthy"
