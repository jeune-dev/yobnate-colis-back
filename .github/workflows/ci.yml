name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint et formatage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run lint
      - run: npm run format:check

  migrations:
    name: Migrations (base vierge, aller-retour, conformité du schéma)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yobmigr
          POSTGRES_PASSWORD: yobmigr
          POSTGRES_DB: yobante_colis_migrations
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yobmigr"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: production
      DB_SSL: 'false'
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: yobmigr
      DB_PASSWORD: yobmigr
      DB_NAME: yobante_colis_migrations
      # Valeurs factices, valables uniquement ici (config/security.js les exige au chargement)
      JWT_SECRET: ci_uniquement_secret_acces_jamais_utilise_en_production
      JWT_REFRESH_SECRET: ci_uniquement_secret_refresh_jamais_utilise_en_production
      CORS_ORIGIN: http://localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts --no-fund
      - name: Toutes les migrations, puis retour arrière et rejeu de la dernière
        run: |
          npm run migrate
          npm run migrate:undo
          npm run migrate
      - name: Idempotence (second passage sans effet)
        run: npm run migrate
      - name: Schéma conforme aux modèles
        run: node scripts/verifierSchema.js

  test:
    name: Tests (unitaires, sécurité, intégration, bout en bout)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yobtest
          POSTGRES_PASSWORD: yobtest
          # Base jetable : son nom doit se terminer par _test (tests/helpers/globalSetup.js)
          POSTGRES_DB: yobante_colis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yobtest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_NAME: yobante_colis_test
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_USER: yobtest
      TEST_DB_PASSWORD: yobtest
      # Base distincte pour les parcours de bout en bout (vidée et reconstruite par la suite)
      E2E_DATABASE_URL: postgres://yobtest:yobtest@127.0.0.1:5432/yobante_colis_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Base des parcours de bout en bout
        env:
          PGPASSWORD: yobtest
        run: psql -h 127.0.0.1 -U yobtest -d yobante_colis_test -c 'CREATE DATABASE yobante_colis_e2e'
      - run: npm test

  docker-build:
    name: Construction de l'image Docker
    runs-on: ubuntu-latest
    needs: [lint, migrations, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t yobante-colis-api:ci .
