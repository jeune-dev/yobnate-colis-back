# ============================================================
#  Yobante Colis API — Docker Compose DÉVELOPPEMENT
#  Usage : cp .env.example .env (puis le remplir) ; docker compose up --build
#  Toutes les valeurs viennent de .env : aucun secret par défaut dans ce fichier.
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: yobante_colis_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:?DB_NAME manquant dans .env}
      POSTGRES_USER:     ${DB_USER:?DB_USER manquant dans .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    # Publié sur la boucle locale uniquement (outils de développement)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yobante_colis_dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432

volumes:
  postgres_data:
